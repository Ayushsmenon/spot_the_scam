<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Spot The Scam Quiz</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: white;
    transition: background 0.25s ease;
}

h1 { text-align: center; margin-top: 30px; color: #6DC3BB; }
h2, h3 { text-align: center; }

#app { max-width: 900px; margin: auto; padding: 20px; }

/* Question Card */
.card {
    background: #4472f0;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    color: white;
}

/* Progress Bar */
.progress-bar {
    width: 100%;
    background: #1a2332;
    height: 14px;
    border-radius: 8px;
    overflow: hidden;
    margin: 10px 0 20px;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #00d4aa, #66e8c8);
    width: 0%;
    transition: width 0.3s ease;
}

/* Buttons */
.btn {
    padding: 15px 22px;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 20px;
    cursor: pointer;
    width: 180px;
}

.btn-red { background: #ff4757; }
.btn-green { background: #00d4aa; color: #021010; }
.btn-orange { background: #ffa502; }

/* Answer Buttons Row - centered side-by-side */
.answer-buttons {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 20px;
}

/* Center start/restart buttons */
.center-btn {
    display: block;
    margin: 20px auto;
}

/* Modal */
.modal-back {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
}
.modal {
    background:#0b1425;
    padding:25px;
    border-radius:12px;
    width:85%;
    max-width:600px;
    text-align:center;
}
#modalBody {
    white-space:pre-wrap;
    font-size:20px;
}

/* Flash */
.flash-screen.correct { animation: flashGreen 1s; }
.flash-screen.wrong { animation: flashRed 1s; }

@keyframes flashGreen { 0%{background:#0aff0a;} 100%{background:#0b1220;} }
@keyframes flashRed { 0%{background:#ff0000;} 100%{background:#0b1220;} }
</style>
</head>

<body>

<div id="app"></div>

<!-- Modal -->
<div id="modalBack" class="modal-back">
    <div class="modal">
        <h3 id="modalTitle"></h3>
        <p id="modalBody"></p>
        <button id="closeModal" class="btn btn-orange center-btn">OK</button>
    </div>
</div>

<script>
// Quiz Data
const quizData = [
  {
    "message": "Subject: Urgent! Verify your bank account now.\nDear customer, your account will be suspended unless you click this link and confirm your details.",
    "answer": "Scam",
    "explanation": "Legitimate banks will never ask you to verify your account via email links."
  },
  {
    "message": "Hey! Want to hang out at the campus cafe after class? Let me know!",
    "answer": "Legit",
    "explanation": "This is a friendly, genuine message."
  },
  {
    "message": "Dear customer, your bank KYC is pending. Your account will be frozen tonight. Click the link below and enter your full card number, PIN and OTP to keep your account active:\nhttp://update-kyc-now-secure.com",
    "answer": "Scam",
    "explanation": "Banks do not threaten instant freezing over SMS links or ask for card number, PIN or OTP on websites or links."
  },
  {
    "message": "You receive ₹200 from an unknown UPI ID with the note: \"Sorry, sent by mistake! Please send ₹2000 back, my app shows error if you send 200 only.\"",
    "answer": "Scam",
    "explanation": "Fraudsters send a small amount to gain trust and then trick you into sending a much larger amount back."
  },
  {
    "message": "OfficialBank: \"We detected a new login on your account from a different city. If this was you, ignore this message. If not, please call the number on the back of your card immediately.\"",
    "answer": "Legit",
    "explanation": "A genuine alert often tells you to use the official number on your card or app, not a random link or phone number."
  },
  {
    "message": "CONGRATS! You have won a brand new iPhone in our random WhatsApp giveaway. To claim, pay a small processing fee of ₹499 via this UPI ID and share a screenshot within 10 minutes.",
    "answer": "Scam",
    "explanation": "Random prize messages that demand an advance payment under time pressure are classic scam patterns."
  },
  {
    "message": "Your friend messages from her usual Instagram account: \"Hey, can you quickly pay this electricity bill for me? I’m travelling, will UPI you back tonight.\" She shares the standard electricity provider link and bill details.",
    "answer": "Legit",
    "explanation": "If it is the usual account, normal amount and a recognizable biller link, it can be a genuine favour request."
  },
  {
    "message": "A message claims to be from your college admin: \"Upload your Aadhaar, PAN and bank passbook scan here in the next 30 minutes or your admission will be cancelled. Use this Google Form link shared only with you.\"",
    "answer": "Scam",
    "explanation": "Institutions rarely threaten immediate cancellation or use random links to collect sensitive ID plus bank details."
  },
  {
    "message": "A part‑time job ad says: \"Earn ₹5000 a day by liking YouTube videos. Pay a refundable registration fee of ₹999 first to join the VIP group.\"",
    "answer": "Scam",
    "explanation": "Job scams often promise very high income for simple tasks but demand an upfront registration or training fee."
  },
  {
    "message": "You get an email using your real name: \"We noticed unusual sign‑in attempts on your email account. Go to Settings > Security > Recent activity in your account to review and secure your login.\" No links are provided.",
    "answer": "Legit",
    "explanation": "Legit security alerts can guide you to navigate inside the official app or website instead of clicking external links."
  },
  {
    "message": "You receive an SMS: \"Your income‑tax refund of ₹16,820 is ready. Click here to verify your debit card and ATM PIN to receive immediately: http://fast-tax-refund-now.com\"",
    "answer": "Scam",
    "explanation": "Tax departments do not ask for debit card details or ATM PIN through random links to issue refunds."
  },
  {
    "message": "You get a WhatsApp message: \"Instagram Support: Your account will be disabled for copyright violation. Reply with the 6‑digit code you just received by SMS so we can verify and keep your account active.\"",
    "answer": "Scam",
    "explanation": "Legit platforms never ask you to share OTPs or verification codes over chat; scammers use these to hijack accounts."
  }

] ;

let index = 0;
let score = 0;

const modalBack = document.getElementById("modalBack");
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");

document.getElementById("closeModal").onclick = nextQuestion;

// START SCREEN
function showStartScreen() {
    document.getElementById("app").innerHTML = `
        <h1>🚨 SPOT THE SCAM QUIZ 🚨</h1>
        <p style="text-align:center;font-size:22px;">Can you identify real vs scam messages?</p>

        <button class="btn btn-green center-btn" onclick="startQuiz()">▶️ Start Quiz</button>
    `;
}

function startQuiz() {
    index = 0;
    score = 0;
    showQuestion();
}

// Show Question
function showQuestion() {
    const q = quizData[index];

    document.getElementById("app").innerHTML = `
        <h1>🚨 SPOT THE SCAM QUIZ 🚨</h1>

        <div class="card" id="questionCard">
            <h3>Question ${index+1}/${quizData.length}</h3>

            <div class="progress-bar">
                <div class="progress-fill" style="width:${(index/quizData.length)*100}%"></div>
            </div>

            <h3>📱 Situation:</h3>
            <p style="white-space:pre-wrap;font-size:22px;">${q.message}</p>

            <div class="answer-buttons">
                <button class="btn btn-red" onclick="checkAnswer('Scam')">🚨 SCAM</button>
                <button class="btn btn-green" onclick="checkAnswer('Legit')">✅ LEGIT</button>
            </div>

            <button class="btn btn-orange center-btn" onclick="showTips()">💡 Tips</button>
        </div>
    `;
}

// Flash effect
function flash(type) {
    document.body.classList.add("flash-screen", type);
    setTimeout(() => document.body.classList.remove("flash-screen", type), 250);
}

// Check Answer
function checkAnswer(choice) {
    const q = quizData[index];
    const correct = (choice === q.answer);

    flash(correct ? "correct" : "wrong");

    modalTitle.textContent = correct ? "Correct!" : "Wrong!";
    modalBody.textContent = q.explanation;

    modalBack.style.display = "flex";

    if (correct) score++;
}

function nextQuestion() {
    modalBack.style.display = "none";
    index++;
    if (index >= quizData.length) showScore();
    else showQuestion();
}

// Tips
function showTips() {
    modalTitle.textContent = "Scam Spotting Tips";
    modalBody.textContent =
        "• Never click suspicious links.\n"+
        "• Never share OTP/PIN.\n"+
        "• Check sender identity.\n"+
        "• Watch for urgency tricks.";
    modalBack.style.display = "flex";
}

// Final Score
function showScore() {
    document.getElementById("app").innerHTML = `
        <h1>🎯 Score: ${score}/${quizData.length}</h1>

        <div class="card">
            <h2 style="font-size:30px;">
                ${
                score === quizData.length ? "Perfect! You're a scam-detection master!" :
                score >= quizData.length * 0.7 ? "Great job! Stay alert!" :
                "Keep practicing — scammers are sneaky!"
                }
            </h2>

            <button class="btn btn-green center-btn" onclick="showStartScreen()">Restart</button>
        </div>
    `;
}

// Load Start Screen
showStartScreen();
</script>

</body>
</html>
